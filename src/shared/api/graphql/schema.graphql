"Query root"
type Query {
  adminCustomer(id: String): AdminCustomerDetailDto
  "Admin paginated product list with SKU, stock, and price. Staff JWT required."
  adminProductList(brandId: String, categoryId: String, pageIndex: Int = 0, pageSize: Int = 10, search: String, status: String): PageResponse_AdminProductListItemDto
  "Product count breakdown by status. Staff JWT required."
  adminProductStats: AdminProductStatsDto
  allBrands(filterRequest: FilterRequestInput, pageRequest: PageRequestInput): [BrandDto]
  "Get all categories"
  allCategories(filterRequest: FilterRequestInput, includeSubCategories: Boolean = false, pageRequest: PageRequestInput): [CategoryDto]
  allCustomers(filterRequest: FilterRequestInput, pageRequest: PageRequestInput): [AdminCustomerListItemDto]
  "Get all orders with paging, newest created orders first by default"
  allOrders(filterRequest: FilterRequestInput, pageRequest: PageRequestInput): [OrderResponseDto]
  allWholesaleApplications(filterRequest: FilterRequestInput, pageRequest: PageRequestInput): [WholesaleApplicationListItemDto]
  brand(id: String): BrandDto
  brandCount(filterRequest: FilterRequestInput): BigInteger!
  "Get a category by ID"
  category(id: String): CategoryDto
  categoryCount(filterRequest: FilterRequestInput): BigInteger!
  "Get all country settings used for locale/currency formatting"
  countrySettings: [CountrySettingsDto]
  customerCount(filterRequest: FilterRequestInput): BigInteger!
  "Returns all featured products for admin management, ordered by name ascending."
  featuredProductList: [AdminProductListItemDto]
  "Get paginated brands for storefront filtering."
  getBrands(filterRequest: FilterRequestInput, pageIndex: Int = 0, pageSize: Int = 500): PageResponse_BrandDto
  "Get paginated categories for storefront filtering. Returns all categories including subcategories."
  getCategories(filterRequest: FilterRequestInput, pageIndex: Int = 0, pageSize: Int = 500): PageResponse_CategoryDto
  "Get order detail by order id"
  getOrderDetail(id: String): OrderDetailRespDto
  "Returns the list of product price import rows for a given batch ID"
  getPriceImportRows(batchId: String): [ProductPriceComparisonDto]
  "Fetch a product with all variants, categories, and images for a given product id. Products can belong to multiple categories which are returned in the response."
  getProductInformation(productId: String): ProductInformationDto
  "Fetch a product with all variants by slug."
  getProductInformationBySlug(slug: String): ProductInformationDto
  "Returns the list of product import rows for a given batch ID"
  importRows(batchId: String): [ProductComparisonDto]
  "Get authenticated customer's order history"
  myOrders: [OrderSummaryDto]
  "Update an order and return"
  orderById(id: String): OrderResponseDto
  "Get the latest order for a given sessionId"
  orderBySessionId(sessionId: String): OrderResponseDto
  "Returns the total number of products matching the given filter, optionally scoped to a category (including subcategories) and/or a brand."
  productCount(
    "Optional brand UUID. Restricts count to products linked to this brand."
    brandId: String,
    "Optional category UUID. Includes products in this category and all subcategories. Pass null or omit for all categories."
    categoryId: String,
    filterRequest: FilterRequestInput,
    "When true, skips the default ACTIVE product and variant status restriction."
    ignoreStatus: Boolean = false
  ): BigInteger!
  "Returns a paged list of products with active retail or wholesale pricing. Category scoping is not applied in this endpoint."
  productList(filterRequest: FilterRequestInput, pageRequest: PageRequestInput): [ProductListItemDto]
  "Returns a paged list of products linked to a mandatory brand."
  productListByBrand(
    "Required brand UUID."
    brandId: String,
    filterRequest: FilterRequestInput,
    "When true, skips the default ACTIVE product and variant status restriction."
    ignoreStatus: Boolean = false,
    pageRequest: PageRequestInput
  ): [ProductListItemDto]
  "Returns a paged list of products for a mandatory category. Optionally includes categories under the same parent scope."
  productListByCategory(
    "Required category UUID."
    categoryId: String,
    filterRequest: FilterRequestInput,
    "When true, skips the default ACTIVE product and variant status restriction."
    ignoreStatus: Boolean = false,
    "When true, products in the selected category and related parent-scope categories are included."
    includeSubCategories: Boolean = true,
    pageRequest: PageRequestInput
  ): [ProductListItemDto]
  "Returns the list of all product price upload batches"
  productPriceUploadBatches: [ProductUploadBatchDto]
  "Returns the list of all product upload batches"
  productUploadBatches: [ProductUploadBatchDto]
  "Returns shopping product cards that currently have active RETAIL_SALE_PRICE or WHOLESALE_SALE_PRICE values only."
  saleProductList(
    "When true, skips the default ACTIVE product and variant status restriction."
    ignoreStatus: Boolean = false,
    pageRequest: PageRequestInput
  ): [ProductShoppingListItemDto]
  "Get all settings including store settings and shipping methods"
  settings: SettingsDto
  "Get all available shipping options"
  shippingMethods: [ShippingMethodDto]
  "Returns featured ACTIVE products as shopping DTOs for the storefront. Publicly accessible."
  shoppingFeaturedProductList(categorySlug: String, limit: Int = 8): [ProductShoppingListItemDto]
  "Returns paginated shopping product cards with variant count, image list, and active lowest prices by type. Products can belong to multiple categories. Supports optional category scope and includeSubCategories."
  shoppingProductList(
    "Optional main category UUID. If omitted or ALL, returns products across all categories."
    categoryId: String,
    filterRequest: FilterRequestInput,
    "When true, skips the default ACTIVE product and variant status restriction."
    ignoreStatus: Boolean = false,
    "When true, includes products linked to the selected category and all descendant categories. When false, only products linked directly to the selected category are returned."
    includeSubCategories: Boolean = true,
    pageIndex: Int = 0,
    pageSize: Int = 20
  ): PageResponse_ProductShoppingListItemDto
  "Returns a staff member by ID"
  staffById(id: String): StaffDto
  "Returns the total number of staff matching the given filter."
  staffCount(filterRequest: FilterRequestInput): BigInteger!
  "Returns a paged list of staff members"
  staffList(filterRequest: FilterRequestInput, pageRequest: PageRequestInput): [StaffDto]
  "Get all general store toggles"
  storeSettings: [StoreSettingsDto]
  "Returns the number of rows in the 'public.test' table"
  testRowCount: BigInteger!
  "Returns the top 10 best-selling products ranked by units sold in DELIVERED orders. Products can belong to multiple categories. If fewer than 10 delivered-order products exist, the list is padded with random products."
  topBestSellers: [ProductShoppingListItemDto]
  "Fetch product variants by a list of ids, including product relation and prices for the selected category"
  variantsByIds(ids: [String]): [ProductVariantDto]
  wholesaleApplication(id: String): WholesaleApplicationDetailsDto
  wholesaleApplicationCount(filterRequest: FilterRequestInput): BigInteger!
}

