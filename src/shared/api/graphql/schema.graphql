"Mutation root"
type Mutation {
  "Create a new product with variants, images, and multiple categories. Products can be assigned to one or more categories."
  addProductInformation(input: ProductInformationDtoInput): ProductInformationDto
  "Creates a new staff user"
  addStaffUser(staffDto: StaffDtoInput): Void
  approveWholesaleApplication(id: String): WholesaleApplicationDetailsDto
  "Completes a customer password reset using a valid token."
  completeCustomerPasswordReset(newPassword: String, token: String): String
  createBrand(brandDto: BrandDtoInput): Void
  "Create a new category"
  createCategory(categoryDto: CategoryDtoInput): Void
  createWholesaleApplication(customer: WholesaleCustomerDtoInput): WholesaleCustomerDto
  deleteBrand(id: String): Void
  "Delete a category"
  deleteCategory(id: String): Void
  "Delete a product and all its variants. SUPER_ADMIN only."
  deleteProduct(id: String): Void
  "Initiates a customer password reset. Always returns a generic message."
  initiateCustomerPasswordReset(email: String): String
  rejectWholesaleApplication(id: String, reason: String): WholesaleApplicationDetailsDto
  saveShippingMethod(methodDto: ShippingMethodDtoInput): ShippingMethodDto
  saveStoreSettings(storeSettingsDto: [StoreSettingsDtoInput]): [StoreSettingsDto]
  "Toggle the featured flag on a product. SUPER_ADMIN only."
  setProductFeatured(featured: Boolean!, productId: String): FeaturedProductResultDto
  updateBrand(brandDto: BrandDtoInput, id: String): Void
  "Update an existing category"
  updateCategory(categoryDto: CategoryDtoInput, id: String): Void
  updateCustomerStatus(id: String, status: String): AdminCustomerListItemDto
  "Update the status of the latest order for a given sessionId"
  updateOrderStatus(sessionId: String, status: String): OrderResponseDto
  "Update an existing product with variants, images, and multiple categories. When updating categories, all previous category assignments are replaced with the new ones provided."
  updateProductInformation(input: ProductInformationDtoInput, productId: String): ProductInformationDto
  "Update a product's status. SUPER_ADMIN only."
  updateProductStatus(id: String, status: String): Void
  updateQuoteRequestStatus(id: String, status: String): QuoteRequestDetailsDto
  updateSetting(key: String, value: String): StoreSettingsDto
  "Updates an existing staff user"
  updateStaffUser(id: String, staffDto: StaffDtoInput): Void
  updateWholesaleCustomer(customer: WholesaleCustomerDtoInput, id: String): WholesaleCustomerDto
}

