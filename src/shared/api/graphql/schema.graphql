enum AddressTypeEn {
  BILLING
  PHYSICAL
  POSTAL
  SHIPPING
}

enum ContactRoleEn {
  BUYER
  FINANCE
  MANAGER
}

enum CustomerStatusEn {
  ACTIVE
  DISABLED
  PENDING
}

enum CustomerTypeEn {
  GUEST
  RETAILER
  WHOLESALER
}

enum FilterOperator {
  BETWEEN
  EQUALS
  GREATER_THAN
  GREATER_THAN_OR_EQUALS
  ILIKE
  IN
  IS_NOT_NULL
  IS_NULL
  LESS_THAN
  LESS_THAN_OR_EQUALS
  LIKE
  NOT_BETWEEN
  NOT_EQUALS
  NOT_IN
  NOT_LIKE
}

enum LogicalOperator {
  AND
  OR
}

enum OrderStatusEn {
  CANCELLED
  CREATED
  DELIVERED
  FAILED
  IN_STORE_PAYMENT
  IN_TRANSIT
  PAID
  PENDING
  SYSTEM_CANCELED
}

enum PriceTypeEn {
  RETAIL_PRICE
  RETAIL_SALE_PRICE
  WHOLESALE_PRICE
  WHOLESALE_SALE_PRICE
}

enum ProductImportValidationStatusEn {
  INVALID
  VALID
}

enum ProductStatusEn {
  ACTIVE
  DISABLED
  PENDING
}

enum ProductTypeEn {
  SIMPLE
  VARIABLE
}

enum SortDirection {
  ASC
  DESC
}

enum StaffRoleEn {
  CATALOG_MANAGER
  ORDER_MANAGER
  SUPER_ADMIN
  VIEWER
}

enum WholesaleApplicationStatusEn {
  APPROVED
  CONVERTED
  PENDING
  REJECTED
}

enum WholesaleCustomerStatusEn {
  ACTIVE
  APPROVED
  CONVERTED
  DISABLED
  PENDING
  REJECTED
}

input BrandDtoInput {
