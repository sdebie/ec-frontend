enum CatalogueSortEn {
  NAME_ASC
  PRICE_ASC
  PRICE_DESC
}

enum FilterOperator {
  BETWEEN
  EQUALS
  GREATER_THAN
  GREATER_THAN_OR_EQUALS
  ILIKE
  IN
  IS_NOT_NULL
  IS_NULL
  LESS_THAN
  LESS_THAN_OR_EQUALS
  LIKE
  NOT_BETWEEN
  NOT_EQUALS
  NOT_IN
  NOT_LIKE
}

enum LogicalOperator {
  AND
  OR
}

enum OrderStatusEn {
  CANCELLED
  CREATED
  DELIVERED
  FAILED
  IN_STORE_PAYMENT
  IN_TRANSIT
  PAID
  PENDING
  SYSTEM_CANCELED
}

enum PriceBasisEn {
  RETAIL
  WHOLESALE
}

enum ProductImportValidationStatusEn {
  INVALID
  VALID
}

enum QuoteRequestStatusEn {
  CLOSED
  IN_PROGRESS
  NEW
}

enum SortDirection {
  ASC
  DESC
}

enum StaffRoleEn {
  CATALOG_MANAGER
  ORDER_MANAGER
  SUPER_ADMIN
  VIEWER
}

enum WholesaleApplicationStatusEn {
  APPROVED
  CONVERTED
  PENDING
  REJECTED
}

enum WholesaleCustomerStatusEn {
  ACTIVE
  APPROVED
  CONVERTED
  DISABLED
  PENDING
  REJECTED
}

