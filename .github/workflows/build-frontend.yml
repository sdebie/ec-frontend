name: Build and Push Frontend Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'ec-frontend/**'
      - '.github/workflows/build-frontend.yml'

# Grant write access to publish package containers to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ensures uppercase GitHub usernames/repos (like "ShawnDeBie") don't break Docker image tags
      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./ec-frontend
          file: ./ec-frontend/Dockerfile.jvm  # 🚀 Points to your Dockerfile.jvm
          push: true
          tags: ghcr.io/${{ steps.string.outputs.REPO_LC }}/ec-frontend:latest
          build-args: |
            VITE_API_URL=https://ecapi.sdebiehome.co.za