name: Build and Push Frontend Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Formats upper-case GitHub usernames/repos (e.g., "ShawnDeBie") to lower-case for Docker rules
      - name: Lowercase Repository Name
        id: string
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.jvm
          push: true
          tags: ghcr.io/${{ steps.string.outputs.REPO_LC }}:latest
          build-args: |
            VITE_API_URL=https://ecapi.sdebiehome.co.za
            VITE_IMAGE_BASE_URL=/static/images/
            VITE_API_BASE_URL=/api
            VITE_PROXY_TARGET=http://ec-backend:8080