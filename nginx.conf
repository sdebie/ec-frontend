server {
    listen 80;
    server_name localhost;

    # 1. Serve static React files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy /storefront requests to Quarkus /api/storefront
    location /storefront/ {
        proxy_pass http://ec-backend:8080/api/storefront/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy general /api requests
    location /api/ {
        # 'ec-backend' is the container service name in docker-compose.yml
        proxy_pass http://ec-backend:8080/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy static image requests (resolveImageUrl() on the frontend
    # resolves DB/config image paths to /static/images/...) to the backend's
    # storage-backed route registered in Startup.java.
    location /static/ {
        proxy_pass http://ec-backend:8080/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}