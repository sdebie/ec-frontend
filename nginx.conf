server {
    listen 80;
    server_name localhost;

    # 1. Serve static built React assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Essential for SPA router: redirects non-file requests to index.html
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy storefront config & API endpoints to the Quarkus backend container
    location /storefront/ {
        proxy_pass http://ec-backend:8080/storefront/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Proxy general API endpoints if needed
    location /api/ {
        proxy_pass http://ec-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Cache static images/assets
    location /static/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}