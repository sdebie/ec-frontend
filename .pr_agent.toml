[config]
auto_review = true

[github_action]
handle_push_trigger = true

[pr_reviewer]
extra_instructions = """
React Code Review Guidelines:
- Check React Hooks dependency arrays (useEffect, useCallback, useMemo) for missing or unnecessary variables.
- Ensure proper useEffect cleanup functions exist for event listeners, intervals, or subscriptions.
- Flag unstable key props in lists (e.g. using array index as a key).
- Verify semantic HTML for accessibility (a11y).
- Check proper handling of async loading and error states.
- Prevent unnecessary inline object/function re-renders.
- Ignore general linting or formatting issues handled by Prettier/ESLint.
"""
inline_suggestions_range = [1, 8]